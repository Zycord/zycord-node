# Continuous integration.
#
# CI is not a formality here: `core/` and `spec/` changes are required to be
# green *before* human review is scheduled, so this workflow is the first
# reviewer every consensus patch meets.

name: ci

# What runs when, and why it is a condition rather than a second file.
#
# Every job below still lives in THIS file and keeps its job id. That is not
# tidiness: sim/wiring/workflow_test.go parses ci.yml and asserts an exact job
# set, and it attributes every command it finds to the job that runs it, so a
# job moved into a new workflow becomes a command nothing reviews — which is
# the blindness that test's own header records from the last extraction. A
# job gated with `if:` is still parsed, still policed, and still fails the
# wiring test the day somebody changes what it runs.
#
# There are three tiers, and the thing that separates them is not importance
# but WHEN the answer is worth paying for.
#
#   nothing        a draft pull request, and every push to a branch that is
#                  not main. Work in progress bills zero minutes.
#   verification   a pull request that has been marked ready for review, and
#                  everything the heavy tier runs on. Tests, vets, lints,
#                  spec vectors, the differential fold, fuzz, the desktop
#                  bridge, Windows — the checks that catch a defect a
#                  reviewer would otherwise merge blind.
#   heavy          pushes to main, tags, and `workflow_dispatch`. Container
#                  builds, byte-for-byte reproducibility, the cgo engine
#                  across two architectures, the race detector. Minutes, not
#                  seconds, and none of them is a gate a review needs.
#
# # Why draft pull requests run nothing
#
# A draft pull request is where the same commit is pushed over and over, and
# GitHub does NOT skip a draft on its own: without the condition below, every
# one of those pushes bills a full `synchronize` run. With many concurrent
# branches in flight that is most of the bill, spent re-answering a question
# nobody has asked yet. So every job carries the same guard:
#
#     if: github.event_name != 'pull_request' || !github.event.pull_request.draft
#
# It is written on each job rather than once at the top because a workflow has
# no workflow-level `if:`. A skipped job bills nothing; the run itself appears
# in the checks list with every job grey, which is the intended reading — the
# work exists and has not been submitted.
#
# `ready_for_review` is in the trigger's `types:` for the same reason the
# guard cannot be `types: [ready_for_review]` alone. Marking a draft ready
# fires ONLY that event: without it in the list, a pull request written as a
# draft and then submitted would never run at all. Without `opened` and
# `synchronize` beside it, a pull request opened ready — or one already ready
# that gets a fix pushed to it — would never run either. The list is the union
# of "somebody is asking for review" and the guard is what removes the drafts
# from it; neither half works alone, and `reopened` is there because a closed
# and reopened pull request is a fresh request for the same review.
#
# # Why the heavy tier is not at review time
#
# `canonical`, both legs of `randomx`, `reproducible` and the `make race` STEP
# inside `build` were already skipped for `pull_request`, and they stay
# skipped: they re-verify build determinism and engine behaviour that the
# merge to main re-checks minutes later, and together they are most of the
# bill. The same reasoning now names the tier rather than the event, so the
# condition reads as the policy instead of as a list of exclusions.
#
# What deliberately stays in the verification tier, because each is the only
# thing that checks what it checks, at the only time it is useful:
#
#   windows      the only Windows execution anywhere at review time; see
#                windows.yml for the four defects that were green on every
#                Linux runner. It is the most expensive job in this tier —
#                Windows runners bill at twice a Linux minute — and it stays
#                anyway, because a Windows-only defect found after merge is
#                found on main.
#   vectors      the only regeneration of spec/vectors. `go test ./spec/`
#                passes when the corpus and the implementation have drifted
#                together, so without this an undeclared consensus change is
#                reviewed green.
#   desktop      the bridge contract breaks in ordinary node-zone changes, not
#                at release time.
#   fuzz         90 seconds a target; the cheapest real bug-finder here.
#   differential two implementations of the fold must agree on every
#                observable; divergence is a release blocker and it is a
#                single `go test -run`.
#   build        minus its race step: lint, the import graph, `make test`, the
#                Wails contamination check — all cheap, and the contamination
#                check exists in no other workflow.
#
# # Why `dev` is not in the push list
#
# It is not an oversight and it is not a change: `push` has named main alone
# since this trigger was written, and it keeps naming main alone. Every commit
# reaching `dev` arrives through a pull request into `dev`, and that pull
# request has already run the verification tier at ready-for-review. Adding
# `dev` here would re-run that same tier on the merge commit, which is the
# identical tree in the ordinary fast-forward case — paying twice for one
# answer. The merge into `main` is where the heavy tier earns its minutes,
# because that is the first time the integration of many branches is a tree
# nothing has built before. If a `dev` merge ever needs the full set, that is
# what `workflow_dispatch` is for, and it can be pointed at `dev` directly.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    # The union of the events that mean "somebody is asking for review". The
    # draft half is removed by the per-job guard, not here: `ready_for_review`
    # alone would miss a pull request opened ready and every later push to
    # one, and `opened`/`synchronize` alone would miss the draft that is
    # submitted without another commit. See the header.
    types: [opened, synchronize, reopened, ready_for_review]
  # So the full set can be demanded on a branch without minting a tag.
  workflow_dispatch:

# One run per ref. A force-push to a pull request used to leave the previous
# run going and start a second alongside it, and on this workflow that is the
# single largest waste available — larger than any job below. Never applied to
# a tag: a release run must not be cancellable by whatever is pushed next.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  build:
    # Verification tier: skipped on a draft pull request, because a draft is
    # work in progress and GitHub does not skip one on its own — every push
    # to it would otherwise bill a full run. See the header.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: false
      # Before any step that runs tests, because wallet/webui's parse check
      # compiles the frontend with whatever `node` is on PATH, and
      # `go test ./...` two steps down is the first thing to reach it. Pinning
      # the binary is the point: ubuntu-latest ships a node, so without this
      # the frontend's verdict would move with the runner image rather than
      # with this file. Installed, never depended on by the module -- go.mod is
      # untouched and nothing here links against it.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: vet and formatting
        run: make lint
      # Arrows point inward only. core/ imports nothing but the standard
      # library, and nothing in core/ reaches the node, the wallet or the
      # simulator.
      - name: import graph
        run: make check-imports
      # `make test`, for the reason the race step below already records: a
      # command duplicated here is a command that stops tracking the Makefile.
      # The two are identical today, which is exactly when the divergence is
      # free to fix — the race step was identical too, right up until a commit
      # gave the Makefile a timeout that this file never got.
      #
      # The `windows` job deliberately keeps its own inline `go test ./...`:
      # GNU make is absent from that runner image, so the Makefile is not the
      # entry point on that platform (CONTRIBUTING.md, and the job's own
      # header). Here, on ubuntu, it is.
      - name: tests
        run: make test
      # `make race`, not an inline `go test -race`: the Makefile target carries
      # an explicit 30m timeout, and Go's ten-minute default is not enough for
      # node/mempool's eviction suite under the race detector on every machine
      # this runs on — including this runner. Duplicating the command here is
      # how that fix landed in the Makefile and left CI still failing.
      # Skipped on a pull request and run on every push to main, every tag and
      # on demand. The step is kept here, with its command intact, rather than
      # moved: sim/wiring/workflow_test.go matches this job, directory and
      # command text and never reads `if:`, so gating keeps it policed where
      # relocating it would not.
      # Heavy tier at step granularity: the rest of this job is verification
      # and runs at review time, this one step does not. A pull request, draft
      # or ready, skips it; main, a tag and `workflow_dispatch` run it.
      - name: tests with the race detector
        if: github.event_name != 'pull_request'
        run: make race
      # The node's crash-safety suite kills real processes; keep it explicit so
      # a failure names the guardrail it broke rather than hiding in the pack.
      - name: storage atomicity under crashes (M1-G1)
        run: go test -run 'TestCommitIsAllOrNothing|TestSurvivesSigkill|TestTornTail|TestCompactionIsCrashSafe' -v ./node/storage/
      - name: restart equivalence and startup integrity (M1-G2, M1-G3)
        run: go test -run 'TestRestartEquivalence|TestStartupIntegrity|TestWrongNetwork' -v ./node/chain/
      # ~900 lines of hand-written JavaScript reach both front ends through
      # go:embed, and until this step existed nothing in this tree parsed them:
      # a syntax error in app.js or transport.js is a wallet that loads a blank
      # page, with `go test ./...` green, `make ci` green, and wallet/webui's
      # own suite green. The wallet holds an unlocked key; an interface that
      # silently fails to render is not a cosmetic failure.
      #
      # The check itself is a Go test (wallet/webui/assets_parse_test.go)
      # rather than a shell loop here, so that a contributor sees it before CI
      # does and so that this file and the test cannot drift into two versions
      # of one rule -- the mistake the `make race` comment above records.
      #
      # It compiles each asset with `vm.Script`, NOT with `node --check`. The
      # obvious command is the wrong one and measurably so: `--check` compiles
      # through node's CommonJS module wrapper, so `return;` and `new.target`
      # at top level pass it and are SyntaxErrors in a browser -- an app.js
      # that never executes, sailing past the check meant to catch it. Nothing
      # is installed and nothing is executed either way: no package.json, no
      # node_modules, no dependency graph, and so no npm.
      #
      # This step re-runs two tests `go test ./...` above has already run, for
      # the reason the two steps above it are also named: a failure says which
      # guardrail broke instead of scrolling past inside the pack. It is also
      # the only place `-v` prints PASS or SKIP, so the log says whether node
      # was actually there.
      #
      # Which is why setup-node is at the top of this job beside setup-go, and
      # not here. The node this repository checks against is a pinned input,
      # and `go test ./...` and `make race` both reach the parse test long
      # before this line -- pinning it here would leave the first two runs on
      # whatever binary the image happens to ship, which is the assumption
      # setup-node exists to remove.
      #
      # The test runs a set of controls -- programs it must reject -- through
      # the same command path before it looks at an asset, so a node that is
      # present but wrong fails loudly rather than certifying a broken wallet.
      # A `node --version` line cannot do that: a stub prints a version too.
      # And the test skips when node is absent, which is what keeps `make ci`
      # needing no new toolchain on a contributor's machine; setup-node is what
      # removes the skip here rather than what the check leans on.
      - name: the wallet frontend parses
        run: |
          node --version
          go test -count=1 -run 'TestTheEmbeddedFrontendParses|TestIndexLoadsTheScriptsThatParsed' -v ./wallet/webui/
      # The desktop wallet lives in its own Go module for one reason: to keep
      # this one at two direct dependencies and cgo-free. That is a property
      # nothing else checks, and it would be lost by a single stray import.
      - name: the root module has not been contaminated
        run: |
          if go list -m all | grep -i wails; then
            echo
            echo 'The root module now depends on Wails. desktop/ is a separate module'
            echo 'precisely so that it does not: this makes bin/zcd non-reproducible'
            echo 'and breaks the dependency promise in go.mod.'
            exit 1
          fi
          echo 'root module clean'
      - name: build
        run: make build
      # A launch announcement commits to the genesis id weeks in advance.
      # Rebuilding it on every commit is how we notice the day it moves.
      - name: genesis is reproducible
        run: ./bin/zcd genesis

  vectors:
    # Verification tier: skipped on a draft pull request, because a draft is
    # work in progress and GitHub does not skip one on its own — every push
    # to it would otherwise bill a full run. See the header.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # A regenerated corpus that differs from the committed one is a consensus
      # change that was not declared. Fail loudly.
      - name: the committed vectors match the implementation
        run: |
          go run ./spec/gen
          git diff --exit-code -- spec/vectors || {
            echo
            echo 'The golden vectors changed. This is a consensus change.'
            echo 'Commit the regenerated corpus and explain the diff in the PR.'
            exit 1
          }
      - name: conformance
        run: go test ./spec/

  differential:
    # Verification tier: skipped on a draft pull request, because a draft is
    # work in progress and GitHub does not skip one on its own — every push
    # to it would otherwise bill a full run. See the header.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # Two independent implementations of the fold, one written for speed and
      # one for obviousness, must agree on every observable of every block.
      # Divergence is a release blocker.
      - name: differential fold
        run: go test -run TestDifferential -v ./sim/

  fuzz:
    # Verification tier: skipped on a draft pull request, because a draft is
    # work in progress and GitHub does not skip one on its own — every push
    # to it would otherwise bill a full run. See the header.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # A short run on every commit; the continuous fuzz farm runs the same
      # targets for hours and commits whatever corpus it grows.
      - name: fuzz the decoders
        run: make fuzz FUZZTIME=90s

  # The RandomX engine: the only cgo in the tree, compiled only under the
  # `randomx` tag, and deliberately absent from every other job so that the
  # default build's freedom from a C toolchain keeps being a fact rather than
  # an intention.
  #
  # Matrixed across x86-64 and arm64 because the thing this job exists to catch
  # is architecture-dependent. Upstream's ARM64 and RISC-V code generators
  # carried a bug until v1.2.2 where `ISUB_R` with `src == dst` and
  # `imm == 0x80000000` emitted the wrong instruction, so an ARM machine
  # computed a DIFFERENT HASH from an x86 one for the same header: a chain
  # split along CPU architecture, invisible on any single runner.
  randomx:
    # Heavy tier: pushes to main, tags and `workflow_dispatch` only, and so
    # never at review time. The expression already excludes a draft: it
    # excludes every pull request. See the header for why re-verifying this
    # per review buys nothing the merge does not re-check minutes later.
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x86-64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: false
      # Without a C toolchain, and before anything is compiled: this is the
      # guard that says the vendored tree is byte-identical to the pinned tag.
      # It runs here as well as in `build` because a mismatch makes every
      # result below meaningless — Go's build cache does not see into
      # upstream/, so a modified vendor tree can be tested without ever being
      # compiled.
      - name: the vendored tree matches PINNED
        run: go test -count=1 -run TestVendoredTreeMatchesPinned ./core/pow/randomx/
      - name: build with the engine
        run: make build-randomx
      # The published RandomX vectors, the JIT against the interpreter,
      # hardware AES against software AES, light against fast, and the ISUB_R
      # edge case. -count=1 so a cached result can never stand in for a run.
      - name: engine tests (${{ matrix.arch }})
        run: make test-randomx
      # The cgo half of the same claim. A C toolchain can leak its own paths
      # and a build id into an object file, which -trimpath does not touch.
      - name: the cgo build is byte-identical across paths
        run: make repro-randomx
      # The parameter and the engine have to agree or the node refuses to
      # start, so print both and let a reader see them in the log.
      #
      # bin/zcd-randomx, not bin/zcd: `make build-randomx` writes its own output
      # names so that it cannot overwrite the pure-Go binary, and this
      # step is about the tagged binary specifically.
      - name: the engine names what the parameters require
        run: ./bin/zcd-randomx params | grep '^proof of work'

  # The canonical build container. It pins the C toolchain, which stopped
  # being optional the moment RandomX arrived: -trimpath and a pinned Go
  # toolchain do not fix which compiler ran (R1-L2, ARCHITECTURE §1 P6).
  #
  # Built here rather than only at release time, so that a change to the
  # Dockerfile fails on the merge that lands it rather than on the day somebody
  # tries to cut a release. It used to say "on the pull request that makes it",
  # and that is no longer true: three full container builds is the most
  # expensive job in this workflow, so it is skipped for `pull_request`. A
  # change to build/Dockerfile is one to run `workflow_dispatch` against on the
  # branch, before review rather than after.
  canonical:
    # Heavy tier: pushes to main, tags and `workflow_dispatch` only, and so
    # never at review time. The expression already excludes a draft: it
    # excludes every pull request. See the header for why re-verifying this
    # per review buys nothing the merge does not re-check minutes later.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: the canonical container builds
        run: make canonical-image
      # Twice, inside the container, comparing checksums: the container is the
      # thing being tested, so the comparison has to happen with it.
      #
      # All four binaries, because there are now four: `build` writes bin/zcd
      # and bin/zycordd, `build-randomx` writes bin/zcd-randomx and
      # bin/zycordd-randomx, and until they were given distinct names the second
      # pair silently replaced the first inside this same container invocation.
      # Hashing only the pure-Go pair would leave the cgo pair — the one
      # a RandomX network actually runs — uncompared.
      - name: the canonical build is byte-identical
        run: |
          set -e
          make canonical VERSION=ci-canonical
          sha256sum bin/zcd bin/zycordd bin/zcd-randomx bin/zycordd-randomx > /tmp/sums.1
          make clean
          make canonical VERSION=ci-canonical
          sha256sum bin/zcd bin/zycordd bin/zcd-randomx bin/zycordd-randomx > /tmp/sums.2
          diff /tmp/sums.1 /tmp/sums.2
          cat /tmp/sums.1
      # The comparison neither this job nor release.yml made, and the one that
      # would have caught that overwrite: the canonical build's PURE-GO output
      # against the linux binary `make dist` stages, which is what every archive contains
      # and what a release publishes. The target stages `dist` for the
      # container's OWN GOARCH rather than a written-down one, so it compares
      # native against native on this runner and on an arm64 host alike.
      #
      # The step above diffs the canonical build against itself, so it has no
      # term for the artefact a release ships and is structurally unable to
      # notice that artefact being destroyed. This one has both terms. The whole
      # comparison lives in the Makefile target rather than inline here, because
      # a CI copy of a Makefile recipe drifts from the target it copies: the fix
      # lands in the Makefile and the job keeps failing on the copy, which is
      # what the `make race` comment above records.
      - name: the canonical pure-Go binaries are what make dist ships
        run: make canonical-dist-diff VERSION=ci-canonical

  # The desktop wallet, built and tested as the separate module it is.
  #
  # Its own job rather than a step in `build`, because it needs a webview
  # toolchain that the rest of this repository deliberately does not — and
  # because `make ci` must stay exactly what it was: a green `make ci` is the
  # claim that the protocol is unaffected by any of this.
  desktop:
    # Verification tier: skipped on a draft pull request, because a draft is
    # work in progress and GitHub does not skip one on its own — every push
    # to it would otherwise bill a full run. See the header.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: webview build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      # The frontend calls Go methods by name across a runtime bridge, so a
      # renamed method is a button that does nothing and a green build
      # everywhere else. This is the only thing that checks it.
      #
      # webkit2_41 is not optional on this runner. Wails v2.15.0 asks
      # pkg-config for webkit2gtk-4.0 unless that tag is set
      # (internal/frontend/desktop/linux/*.go, pkg/assetserver/webview/*.go),
      # and libwebkit2gtk-4.0-dev was dropped after Ubuntu 22.04 — it is not in
      # noble, which is what ubuntu-latest now is. Without the tag every step
      # below fails at pkg-config, on a runner that has the 4.1 headers
      # installed two lines above.
      - name: the bridge contract holds
        working-directory: desktop
        run: |
          test -z "$(gofmt -l .)" || { echo 'gofmt: files need formatting'; exit 1; }
          go vet -tags desktop,webkit2_41 ./...
          go test -tags desktop,webkit2_41 ./...
      - name: it builds
        working-directory: desktop
        run: go build -tags desktop,production,webkit2_41 -o /dev/null .

  # The platform the release ships, in its own file because release.yml needs
  # the same job and must not have a second copy of it. See
  # .github/workflows/windows.yml for what it runs and why -- the reasoning
  # moved with the job rather than being left behind here.
  #
  # `uses:` rather than `runs-on:`/`steps:`; the two are mutually exclusive.
  #
  # The called job shows up nested under this one in the checks list, so its
  # name there is no longer a bare `windows`. Nothing depends on that name:
  # branch protection is not available on this repository's plan -- the API
  # answers 403, "Upgrade to GitHub Pro or make this repository public" -- so
  # there are no required status checks for a rename to break.
  windows:
    # Verification tier: skipped on a draft pull request, because a draft is
    # work in progress and GitHub does not skip one on its own — every push
    # to it would otherwise bill a full run. See the header.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    uses: ./.github/workflows/windows.yml

  reproducible:
    # Heavy tier: pushes to main, tags and `workflow_dispatch` only, and so
    # never at review time. The expression already excludes a draft: it
    # excludes every pull request. See the header for why re-verifying this
    # per review buys nothing the merge does not re-check minutes later.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # Trust the code, not the binary. Two builds of one commit must be
      # byte-identical, or "reproducible builds" is a slogan.
      #
      # `make repro`, not two builds in this directory. Building twice in the
      # same place is what this job used to do and it cannot catch a difference
      # that depends on WHERE or HOW the source sits — which is exactly what
      # was there: without -buildvcs=false, the same sources produced different
      # binaries depending on whether a .git directory was beside them. RELEASE
      # §1 publishes the tree WITHOUT history and every verifier checks it from
      # a CLONE, which has one, so every third-party verification would have
      # failed and looked like a compromised binary.
      #
      # repro exports the tree to two different paths and compares those to
      # each other and to the working tree.
      - name: the build is byte-identical across paths and with or without .git
        run: make repro
      # The wallet's half of the same claim, on the one platform that has one.
      #
      # Here as well as in release.yml, for the reason the `canonical` job above
      # gives for itself: a break should fail on the pull request that causes it
      # rather than on the day somebody tries to cut a release. Cross-compiled,
      # so this runner needs no webview toolchain and no Windows -- GOOS and
      # GOARCH select the target, and the target decides CGO_ENABLED, the tags
      # and the link flags (Makefile, DESKTOP_GOOS and below).
      #
      # In *this* job rather than the `desktop` job, which is the other obvious
      # home and is cheaper. Measured, the cost is real: the root module is 6
      # modules and 21 MB of module cache, and desktop/ is 112 modules and 154
      # MB, in a job that had touched only the first. Three reasons it goes here
      # anyway.
      #
      # `reproducible` is the job that *is* the §5 contract, and a reader
      # auditing what enforces it should find all of it in one place rather than
      # half of it behind a job about webviews. The `desktop` job exists because
      # it needs a webview toolchain -- its own comment says so -- and this check
      # needs none; hanging it off that apt-get would make it fail for reasons
      # that have nothing to do with reproducibility. And this site runs on
      # every push to main and every tag, where release.yml's sits behind
      # `if: matrix.goos == 'windows'` and would stop running silently if that
      # leg were ever renamed; this is the site that is not conditioned on a
      # matrix leg's name, which is the insurance. (It was unconditional until
      # this job was taken off `pull_request`; the insurance is against a
      # renamed leg, and a rename still cannot hide from the merge.)
      #
      # What it does not cost: a new external dependency. The `desktop` job in
      # this same workflow already pulls that identical module tree. Whether
      # setup-go's cache covers the second pull cannot be determined without a
      # run -- it keys on the root go.sum -- so it is not claimed here. And the
      # property this repository does protect deliberately, that the *root*
      # module stays Wails-free, is checked in the `build` job above and is
      # untouched: desktop/ is a separate module.
      #
      # It prints a hash and writes no file. `SHA256SUMS.binaries` covers zcd
      # and zycordd and never the wallet (docs/RELEASE.md §5); this job checks
      # the wallet build, it does not attest the wallet binary.
      - name: the windows wallet binary is byte-identical too
        env:
          GOOS: windows
        run: make repro-desktop
