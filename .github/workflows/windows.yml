# The platform the release ships and no job in this tree had ever run.
#
# This job exists because its absence was expensive. The tree shipped
# windows/amd64 and windows/arm64 artefacts while every CI job ran on
# ubuntu, and the first checkout on a Windows machine found four defects
# that no test on any runner could see: a directory fsync that cannot
# succeed on Windows and so failed every wallet save, an O_APPEND log handle
# that cannot be truncated and so failed every compaction after publishing
# its snapshot, a node binary built without .exe that the chaos soak could
# not start at all, and a publish tier that degraded to the racy one on
# exFAT — the format docs/WALLET.md rule 7 names as the likely cold-storage
# medium. Each was invisible rather than untested — the suites covering them
# are thorough and green on Linux.
#
# It is deliberately not `make ci`. GNU make and Info-ZIP are both absent
# from the windows-latest image (MSYS2 is installed but not on PATH), so the
# Makefile is not the entry point on this platform; the commands below are
# the ones a Windows contributor actually runs.
#
# It also deliberately omits the race detector, in a tree whose Makefile opens
# "The race detector is part of CI, not an optional extra" -- so here is a
# reason rather than a silence. On this platform `-race` requires cgo:
#
#     go: -race requires cgo; enable cgo by setting CGO_ENABLED=1
#
# measured on windows/amd64 with no C compiler installed. The runner image has
# mingw-w64, so it could be turned on -- at the cost of making this job depend
# on that toolchain, and of adding a pass whose runtime the Makefile already
# documents as needing a 30-minute ceiling that is tight as it stands. What it
# would buy is small: a data race is in the Go
# code and the same goroutines run everywhere, so the ubuntu race job sees it.
# This job exists for the opposite -- behaviour that differs *because* the
# platform differs -- and all four defects it was added for are syscall
# semantics, not concurrency. If a Windows-only race is ever found, this is the
# paragraph to come back and disagree with.

# It lives in its own file, called by `uses:`, and that is the point of this
# commit rather than a side effect of it. Two workflows need this exact job:
# ci.yml, where it has always been, and release.yml, which touched Windows
# nowhere -- `cli` cross-compiles all six platforms from ubuntu and so does the
# wallet's windows leg. release.yml does not depend on ci.yml, so a tag could be
# cut over a Windows regression that CI had caught on the same commit.
#
# Copying the job into release.yml was the other way to close that, and this
# repository already carries the receipt for copying a command into a second
# place: ci.yml's `make race` comment is about a fix that landed in the Makefile
# and left CI still failing on the copy. This job is ~95 lines of platform
# reasoning and a PowerShell PE-header reader; two copies of it would agree on
# the day they were written and on no day after.
#
# on: workflow_call only. It never runs by itself, so a pull request gets one
# Windows job and not two.

name: windows

on:
  workflow_call:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: false
      # The same node the ubuntu job pins, for the same reason and one more.
      # `go test ./...` below runs wallet/webui's parse test wherever a node
      # is on PATH, and windows-latest ships one -- so without this the check
      # would run here against an unpinned binary while the job that exists to
      # find platform differences pretends it is not doing so.
      #
      # The harness hands node its source over a pipe (fs.readFileSync(0)),
      # which is a path this repository has never executed on Windows. If it
      # misbehaves, positive-control.js fails first and its message says the
      # fault is the invocation and not the wallet -- a loud, self-describing
      # failure being the whole reason the controls are there. The alternative
      # considered was skipping the test on windows: rejected, because the
      # verdict is the same bytes and the same grammar everywhere, so a skip
      # would buy nothing but a claim nobody had checked.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: vet and formatting
        shell: bash
        run: |
          go vet ./...
          test -z "$(gofmt -l . | tee /dev/stderr)" || { echo 'gofmt: files need formatting'; exit 1; }
      # The whole suite, not a subset. Two of the defects above surfaced in
      # packages nobody would have thought to name: node/storage's compaction
      # tests, and cmd/zcd's end-to-end wallet tests.
      - name: tests
        run: go test -timeout 30m ./...
      # Three one-line platform files carry this platform, and each of them
      # fails silently everywhere else, so they are named rather than left in
      # the pack: Windows is the only platform where the wallet's publish tier 1
      # is MoveFileEx, where a file opened O_APPEND cannot set its own length,
      # and where fsync of a directory cannot succeed at all — the last of which
      # made every wallet save report failure *after* writing and publishing the
      # key. The dir-sync test is named once and runs in both packages, which
      # each have their own copy of the classification for the reason
      # writeFileNoClobber's doc comment gives.
      - name: the platform primitives hold (exclusive rename, log truncation, directory fsync)
        run: go test -count=1 -run 'TestRenameNoReplaceIsAnExclusiveRename|TestWriteFileNoClobberPublishesWithTheExclusiveRename|TestTruncateOpenLogWorksOnTheAppendHandle|TestSyncDirOnlyIgnoresUnsupportedPlatformErrors' -v ./wallet/ ./node/storage/
      - name: build
        shell: bash
        run: |
          mkdir -p bin
          CGO_ENABLED=0 go build -trimpath -ldflags '-s -w -buildid=' -o bin/zcd.exe ./cmd/zcd
          CGO_ENABLED=0 go build -trimpath -ldflags '-s -w -buildid=' -o bin/zycordd.exe ./cmd/zycordd
      - name: genesis is reproducible here too
        run: ./bin/zcd.exe genesis
      # The desktop wallet needs no webview package on Windows — WebView2 is a
      # runtime the users have and not a build dependency — but it does need
      # -H windowsgui, without which it links as a console application and
      # ships a black terminal window beside the wallet. The subsystem is
      # checked rather than assumed, because a wrong one still builds, still
      # runs, and is only visible to someone double-clicking the icon.
      - name: the desktop wallet builds as a GUI application
        working-directory: desktop
        shell: bash
        run: |
          go test -tags desktop ./...
          # Built into RUNNER_TEMP rather than into desktop/, on purpose. The
          # obvious `-o zycord-wallet.exe` drops an 11MB PE into the source
          # tree, and .gitignore covering it is a backstop rather than a reason
          # to aim there -- during the review of this branch exactly that
          # artefact was committed, from exactly this command. A build product
          # outside the worktree cannot be committed by anyone.
          go build -tags desktop,production -ldflags -H=windowsgui -o "$RUNNER_TEMP/zycord-wallet.exe" .
      - name: its PE subsystem is WINDOWS_GUI, not console
        shell: pwsh
        run: |
          # An absolute path from RUNNER_TEMP, which also side-steps a trap worth
          # recording: .NET file APIs use the *process* working directory, not
          # PowerShell's location, so a bare relative string here reads a file
          # somewhere else or nothing at all. That is what `Resolve-Path` was for
          # when this step read desktop/zycord-wallet.exe.
          $exe = Join-Path $env:RUNNER_TEMP 'zycord-wallet.exe'
          $fs = [System.IO.File]::OpenRead($exe)
          $br = New-Object System.IO.BinaryReader($fs)
          $fs.Seek(0x3C,'Begin') | Out-Null
          $peOff = $br.ReadInt32()
          # 24 bytes of PE signature + COFF header, then the Subsystem field at
          # offset 68 of the optional header -- the same offset for PE32 and PE32+.
          $fs.Seek($peOff + 24 + 68,'Begin') | Out-Null
          $subsystem = $br.ReadUInt16()
          $br.Close(); $fs.Close()
          if ($subsystem -ne 2) {
            Write-Output "PE subsystem is $subsystem, want 2 (IMAGE_SUBSYSTEM_WINDOWS_GUI)."
            Write-Output "A console-subsystem build opens a terminal window beside the wallet,"
            Write-Output "and closing that terminal kills the process without running OnShutdown"
            Write-Output "-- the handler that wipes the decrypted seed from memory."
            exit 1
          }
          Write-Output "PE subsystem 2: WINDOWS_GUI"
