# Arguments passed to zycordd by the systemd unit.
#
# The data directory is already set by the unit (--dir /var/lib/zycord) and is
# not repeated here.
#
# Pick a network. Without one, zycordd uses the embedded mainnet parameters.
#
#   --testnet                      the public testnet
#   (nothing)                      mainnet
#
# To mine, name a payout address. It must be a persistent (0x02) address: a
# one-shot (0x01) address burns every reward once it is spent.
#
#   --mine --payout 0x02...
#
# To accept inbound peers, publish a listen address and open the port.
#
#   --listen 0.0.0.0:9420
#
# Updates are OFF here, because there is no terminal to ask. The node prints one
# line saying so at start. `notify` tells you when a release is out; `auto`
# installs it, and will correctly refuse to replace a binary this package owns.
#
#   --update notify
#
# See /usr/share/doc/zycord/RUNNING.md and docs/UPDATES.md.

ZYCORDD_ARGS="--testnet"
